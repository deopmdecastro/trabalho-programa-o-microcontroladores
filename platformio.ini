; =============================================================================
; PlatformIO Project Configuration File
; Projeto: Sistema de Arrefecimento de Sala de Máquinas
; Hardware: STM32 Nucleo-L476RG
; Framework: Arduino
; =============================================================================

[env:nucleo_l476rg]
platform  = ststm32
board     = nucleo_l476rg
framework = arduino

; Inclui a pasta 'include/' no path de compilação
build_flags = -I include/

; Bibliotecas necessárias:
;   DHT sensor library  -> sensor de temperatura/humidade DHT11
;   SD                  -> cartão microSD via SPI (memória externa)
;   RTClib              -> RTC interno do STM32 para timestamps nos logs
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/SD @ ^1.2.4
    adafruit/RTClib @ ^2.1.4
